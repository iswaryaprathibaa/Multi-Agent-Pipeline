services:
  - type: web
    name: multi-agent-pipeline-api
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db
      - key: CHROMA_COLLECTION
        value: research_kb
      - key: MAX_REVISIONS
        value: "2"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: multi-agent-research-pipeline
      - key: LANGSMITH_TRACING
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: SERVER_API_KEY
        sync: false
    disk:
      name: chroma-data
      mountPath: /app/chroma_db
      sizeGB: 1
